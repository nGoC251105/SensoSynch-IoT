<!DOCTYPE html>
<html lang="vi">
 <head>
  <meta charset="utf-8"/>
  <meta content="width=device-width,initial-scale=1" name="viewport"/>
  <title>
   SENSOSYNCH | IoT Sensor Dashboard
  </title>
  <link href="css/common.css" rel="stylesheet"/>
  <link href="css/dashboard.css" rel="stylesheet"/>
  <link href="css/sensors.css" rel="stylesheet"/>
  <link href="css/history.css" rel="stylesheet"/>
  <link href="css/profile.css" rel="stylesheet"/>
 </head>
 <body>
  <div class="app">
   <aside class="sidebar">
    <div class="brand">
     <span class="logo">
      ▣
     </span>
     <div>
      <b>
       SENSOSYNCH
      </b>
      <small>
       IoT HUB
      </small>
     </div>
    </div>
    <nav class="nav">
     <button class="active" data-page="dashboard">
      <span aria-hidden="true" class="nav-ic">
       <svg viewbox="0 0 24 24">
        <path d="M3 10.5 12 3l9 7.5">
        </path>
        <path d="M5 9.5V21h14V9.5">
        </path>
       </svg>
      </span>
      <span class="txt">
       Dashboard
      </span>
     </button>
     <button data-page="sensors">
      <span aria-hidden="true" class="nav-ic">
       <svg viewbox="0 0 24 24">
        <rect height="14" rx="2" width="16" x="4" y="5">
        </rect>
        <path d="M8 9h8M8 13h8M8 17h5">
        </path>
       </svg>
      </span>
      <span class="txt">
       Data Sensor
      </span>
     </button>
     <button data-page="history">
      <span aria-hidden="true" class="nav-ic">
       <svg viewbox="0 0 24 24">
        <path d="M12 8v5l3 2">
        </path>
        <circle cx="12" cy="12" r="8">
        </circle>
       </svg>
      </span>
      <span class="txt">
       Action History
      </span>
     </button>
     <button data-page="profile">
      <span aria-hidden="true" class="nav-ic">
       <svg viewbox="0 0 24 24">
        <circle cx="12" cy="8" r="3.3">
        </circle>
        <path d="M5 20c1.7-3.3 4.2-4.8 7-4.8S17.3 16.7 19 20">
        </path>
       </svg>
      </span>
      <span class="txt">
       Profile
      </span>
     </button>
    </nav>
    <div class="online">
     <span>
      ●
     </span>
     Giao diện đang hoạt động
     <div style="color:#7e8ea6;margin-top:8px">
      Kết nối phần cứng thật
     </div>
    </div>
   </aside>
   <main id="main">
   </main>
  </div>
  <div id="toast" role="status">
  </div>
  <script defer="" src="js/state.js">
  </script>
  <script defer="" src="js/api.js"></script>
  <script defer="" src="js/common.js">
  </script>
  <script defer="" src="js/dashboard.js">
  </script>
  <script defer="" src="js/sensors.js">
  </script>
  <script defer="" src="js/history.js">
  </script>
  <script defer="" src="js/profile.js">
  </script>
  <script defer="" src="js/app.js">
  </script>
 </body>
</html>
